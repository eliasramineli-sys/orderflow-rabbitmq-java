server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5439/orderflow}
    username: ${DB_USER:orderflow}
    password: ${DB_PASSWORD:orderflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5673}
    username: ${RABBIT_USER:orderflow}
    password: ${RABBIT_PASSWORD:orderflow}
    publisher-confirm-type: simple
    listener:
      simple:
        default-requeue-rejected: false
        prefetch: 10
orderflow:
  dispatch-delay-ms: 3000
